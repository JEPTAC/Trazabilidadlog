<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061B46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trazabilidad Logística">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Electroingeniería · Trazabilidad Logística</title>

  <script>
    window.__showBootError = function(message) {
      var app = document.getElementById("app");
      if (!app) return;
      app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#f8fafc,#eef2ff)"><section style="max-width:680px;width:100%;background:white;border:1px solid #e2e8f0;border-radius:28px;box-shadow:0 24px 70px rgba(6,27,70,.14);padding:26px"><h1 style="margin:0 0 8px;color:#061B46;font-size:28px;letter-spacing:-.04em">No fue posible iniciar la app</h1><p style="margin:0 0 16px;color:#64748b">Actualiza la página con Ctrl + F5. Si continúa, elimina caché del sitio y vuelve a cargar.</p><pre style="white-space:pre-wrap;background:#0f172a;color:white;padding:14px;border-radius:16px;overflow:auto">'+ String(message).replace(/[<>&]/g, function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]}) +'</pre></section></main>';
    };
    window.addEventListener("error", function(e) { window.__showBootError(e.message || "Error de JavaScript"); });
    window.addEventListener("unhandledrejection", function(e) { window.__showBootError((e.reason && (e.reason.message || e.reason.code)) || e.reason || "Promesa rechazada"); });
  </script>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/app-icon.svg">
  <link rel="preload" href="./assets/logo-electroingenieria.jpeg" as="image">
  <link rel="stylesheet" href="./styles.css">

  <script>
    (function clearOldAppCache(){
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs){
            regs.forEach(function(reg){ reg.unregister(); });
          }).catch(function(){});
        }
        if (window.caches) {
          caches.keys().then(function(keys){
            keys.forEach(function(key){ caches.delete(key); });
          }).catch(function(){});
        }
      } catch(e) {}
    })();
  </script>

</head>
<body>
  <div id="app" class="app-shell"></div>
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./app.github.fix.js?v=2"></script>
</body>
</html>
